name: CI

on:
  push:
    branches: [main, fix/arm64-installer-mutex-handshake]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 build and tests
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Gateway tests
        run: npm test

      - name: WPF build
        shell: powershell
        run: dotnet build .\control-panel\wpf\DeskMCP.ControlPanel.csproj -c Release --nologo -p:ContinuousIntegrationBuild=true

      - name: Installer UI build
        shell: powershell
        run: .\scripts\test-installer-ui.ps1

      - name: Release provenance self-test
        shell: powershell
        run: .\scripts\test-release-provenance.ps1

      - name: Build and smoke x64 installer
        shell: powershell
        run: .\scripts\build-installer.ps1 -Target win-x64

      - name: Update security self-test
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\runtime\release-stage\win-x64\DesktopMCP\DeskMCP.exe -ArgumentList '--update-security-self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Update security self-test failed: $($p.ExitCode)" }

      - name: Runtime reliability self-test
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\runtime\release-stage\win-x64\DesktopMCP\DeskMCP.exe -ArgumentList '--runtime-reliability-self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Runtime reliability self-test failed: $($p.ExitCode)" }

      - name: x64 development release validation
        shell: powershell
        run: .\scripts\check-release-readiness.ps1 -DevelopmentValidation -Target win-x64

      - name: Secret hygiene
        shell: powershell
        run: .\scripts\scan-release-secrets.ps1

      # QA artifacts are NOT official release candidates. Upload only for
      # internal qa/* PR branches, after installer smoke, readiness and secret checks.
      - name: Generate validated QA-only x64 metadata
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'qa/') }}
        shell: powershell
        run: .\scripts\write-qa-artifact-metadata.ps1 -Target win-x64

      - name: Upload QA-only unsigned x64 installer
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'qa/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-NOT-FOR-DISTRIBUTION-win-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            runtime/release/Smallway-Desktop-MCP-Setup-*.exe
            runtime/release/QA-ARTIFACT-win-x64.json
            runtime/release/QA-SHA256SUMS-win-x64.txt

  windows-arm64:
    name: Windows ARM64 release validation
    runs-on: windows-11-arm
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Gateway tests
        run: npm test

      - name: Build and smoke ARM64 installer
        shell: powershell
        run: .\scripts\build-installer.ps1 -Target win-arm64

      - name: ARM64 update security self-test
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\runtime\release-stage\win-arm64\DesktopMCP\DeskMCP.exe -ArgumentList '--update-security-self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "ARM64 update security self-test failed: $($p.ExitCode)" }

      - name: ARM64 runtime reliability self-test
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\runtime\release-stage\win-arm64\DesktopMCP\DeskMCP.exe -ArgumentList '--runtime-reliability-self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "ARM64 runtime reliability self-test failed: $($p.ExitCode)" }

      - name: ARM64 development release validation
        shell: powershell
        run: .\scripts\check-release-readiness.ps1 -DevelopmentValidation -Target win-arm64

      - name: Secret hygiene
        shell: powershell
        run: .\scripts\scan-release-secrets.ps1

      - name: Generate validated QA-only ARM64 metadata
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'qa/') }}
        shell: powershell
        run: .\scripts\write-qa-artifact-metadata.ps1 -Target win-arm64

      - name: Upload QA-only unsigned ARM64 installer
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'qa/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-NOT-FOR-DISTRIBUTION-win-arm64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            runtime/release/Smallway-Desktop-MCP-Setup-*-win-arm64.exe
            runtime/release/QA-ARTIFACT-win-arm64.json
            runtime/release/QA-SHA256SUMS-win-arm64.txt

  macos-arm64-core:
    name: macOS ARM64 core validation
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Verify native runner
        shell: bash
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Gateway and Smallway Desktop MCP backend tests
        run: npm test

      - name: Build native macOS release stage
        shell: bash
        run: bash scripts/build-macos-stage.sh

  qa-downloaded-first-install:
    name: Downloaded QA ${{ matrix.target }} clean install and removal
    # Never run QA setup packages on a user's existing machine. Each matrix
    # entry gets a fresh, disposable GitHub-hosted Windows environment.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'qa/') }}
    needs: [windows, windows-arm64, macos-arm64-core]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-latest
          - target: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout exact test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download uploaded QA setup on independent runner
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: qa-NOT-FOR-DISTRIBUTION-${{ matrix.target }}-${{ github.sha }}
          path: runtime/qa-downloaded/${{ matrix.target }}

      - name: Verify downloaded setup SHA256 and embedded source
        shell: powershell
        run: .\scripts\verify-downloaded-qa-installer.ps1 -Target ${{ matrix.target }} -ArtifactDirectory "runtime\qa-downloaded\${{ matrix.target }}"

      - name: First install, launch, recover and uninstall on clean runner
        shell: powershell
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'runtime\qa-downloaded\${{ matrix.target }}'
          $meta = Get-Content -LiteralPath (Join-Path $dir 'QA-ARTIFACT-${{ matrix.target }}.json') -Raw | ConvertFrom-Json
          .\scripts\test-installer-release.ps1 -Target ${{ matrix.target }} -SetupPath (Join-Path $dir $meta.artifact_name)
